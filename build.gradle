plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Fabric Loom already adds the essential Maven repositories (Minecraft, Fabric, Mixin).
	mavenCentral()
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	// Minecraft 1.21.11 — nothing else.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Yarn mappings for 1.21.11.
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	// Fabric Loader.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (used for the key bind + client tick lifecycle).
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu config screen support.
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Publishing targets can be added here if you want to publish the mod.
	}
}
